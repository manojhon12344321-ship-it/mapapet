<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin MapaPet</title><script src="https://cdn.tailwindcss.com"></script><style>@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&display=swap');body{font-family:'Space Grotesk';background:#050a14;color:white}</style></head>
<body>
<div id="login" class="min-h-screen flex items-center justify-center p-4"><div class="bg-[#0f1629] border border-cyan-400/30 rounded-3xl p-8 max-w-sm w-full"><h2 class="text-2xl font-black">🔒 Admin Master</h2><input id="email" class="w-full mt-4 bg-black/50 border border-white/10 p-3 rounded-xl" value="admin@mapapet.com"><input id="senha" type="password" class="w-full mt-3 bg-black/50 border border-white/10 p-3 rounded-xl" value="admin123"><button id="btnLogin" class="w-full mt-4 bg-cyan-400 text-black py-3 rounded-xl font-black">Entrar</button><p class="text-[10px] text-gray-500 mt-3 text-center">Se falhar, clica 2x que entra em modo dev</p><p id="erro" class="text-red-400 text-xs mt-2 hidden"></p></div></div>
<div id="panel" class="hidden"><header class="flex justify-between p-4 border-b border-white/10 sticky top-0 bg-[#050a14] z-20"><h1 class="font-black">👑 Controle Total MapaPet</h1><div class="flex gap-2"><a href="../" class="bg-white/10 px-3 py-1 rounded-full text-xs">Site</a><button onclick="logout()" class="bg-red-500/20 text-red-400 px-3 py-1 rounded-full text-xs">Sair</button></div></header>
<div class="p-4 grid grid-cols-2 md:grid-cols-5 gap-3"><div class="bg-[#0f1629] rounded-2xl p-3 text-center"><p class="text-[10px] text-gray-400">Total</p><p id="tTotal" class="text-xl font-black text-cyan-400">0</p></div><div class="bg-[#0f1629] rounded-2xl p-3 text-center"><p class="text-[10px] text-gray-400">Perdidos</p><p id="tPerdidos" class="text-xl font-black text-orange-400">0</p></div><div class="bg-[#0f1629] rounded-2xl p-3 text-center"><p class="text-[10px] text-gray-400">Seguros</p><p id="tSeguros" class="text-xl font-black text-green-400">0</p></div><div class="bg-[#0f1629] rounded-2xl p-3 text-center"><p class="text-[10px] text-gray-400">Scans</p><p id="tScans" class="text-xl font-black">0</p></div><div class="bg-[#0f1629] rounded-2xl p-3 text-center"><p class="text-[10px] text-gray-400">Ativos</p><p id="tAtivos" class="text-xl font-black">0</p></div></div>
<div class="p-4"><div class="flex flex-wrap gap-2 mb-4"><input id="busca" class="bg-[#0f1629] border border-white/10 p-3 rounded-xl flex-1 min-w-[180px]" placeholder="🔍 Pet, tutor, whats, bairro..."><select id="fStatus" class="bg-[#0f1629] border border-white/10 p-3 rounded-xl text-sm"><option value="">Todos status</option><option value="seguro">Seguro</option><option value="perdido">Perdido</option></select><select id="fPetshop" class="bg-[#0f1629] border border-white/10 p-3 rounded-xl text-sm"><option value="">Todos petshops</option></select><button onclick="exportCSV()" class="bg-green-500 text-black px-4 py-3 rounded-xl font-black text-xs">📊 Excel</button></div>
<div class="bg-[#0f1629] border border-white/10 rounded-2xl overflow-auto"><table class="w-full text-sm"><thead class="bg-black/50 text-[11px] text-gray-400"><tr><th class="p-3 text-left">Pet</th><th class="p-3 text-left">Tutor</th><th class="p-3 text-left">Status / Ativo</th><th class="p-3 text-left">QR/NFC</th><th class="p-3 text-left">Ações</th></tr></thead><tbody id="tbody"></tbody></table></div>
<div class="mt-8 bg-[#0f1629] border border-orange-500/30 rounded-2xl p-4"><h3 class="font-black">📍 Scans QR/NFC AO VIVO - GPS automático</h3><div id="notifs" class="mt-4 space-y-2 max-h-[400px] overflow-auto"></div></div>
</div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = { apiKey: "AIzaSyBBnA9orBCf3j1_3nRHWcIctLe7aKMgcI8", authDomain: "mapapet-ad359.firebaseapp.com", projectId: "mapapet-ad359", storageBucket: "mapapet-ad359.firebasestorage.app", messagingSenderId: "268931015194", appId: "1:268931015194:web:5ae634751c3be46ebe67a3" };
const app = initializeApp(firebaseConfig); const db=getFirestore(app); const auth=getAuth(app);
let allData=[]; let clickLogin=0;
document.getElementById('btnLogin').addEventListener('click', async()=>{ clickLogin++; const e=document.getElementById('email').value; const s=document.getElementById('senha').value; try{ await signInWithEmailAndPassword(auth,e,s);}catch(err){ if(clickLogin>=2){ document.getElementById('login').classList.add('hidden'); document.getElementById('panel').classList.remove('hidden'); load(); return; } document.getElementById('erro').textContent=err.message; document.getElementById('erro').classList.remove('hidden'); } });
onAuthStateChanged(auth, u=>{ if(u){ document.getElementById('login').classList.add('hidden'); document.getElementById('panel').classList.remove('hidden'); load(); } });
window.logout=async()=>{ await signOut(auth); location.reload(); }
function load(){
  const q = query(collection(db,'clientes'), orderBy('criadoEm','desc'));
  onSnapshot(q, snap=>{ allData=[]; snap.forEach(d=> allData.push({id:d.id, ...d.data()})); const petshops=new Set(allData.map(x=>x.petshopId||'publico')); const sel=document.getElementById('fPetshop'); sel.innerHTML='<option value="">Todos petshops</option>'; petshops.forEach(p=>{ const o=document.createElement('option'); o.value=p; o.textContent=p; sel.appendChild(o);}); render(); });
  const q2 = query(collection(db,'notificacoes'), orderBy('data','desc'));
  onSnapshot(q2, snap=>{ const div=document.getElementById('notifs'); div.innerHTML=''; let c=0; snap.forEach(d=>{ const data=d.data(); const el=document.createElement('div'); el.className='bg-black/50 border border-white/10 rounded-xl p-3 flex justify-between items-center'; el.innerHTML=`<div><p class="font-bold text-sm">${data.petNome||'Pet'} - ${data.tipo||'scan'}</p><p class="text-xs text-gray-400">${data.shortId||''} • ${data.lat? data.lat.toFixed(5)+','+data.lng.toFixed(5) : 'sem GPS'}</p></div><a href="https://www.google.com/maps?q=${data.lat},${data.lng}" target="_blank" class="bg-cyan-400 text-black px-3 py-1 rounded-full text-xs font-black">Maps</a>`; div.appendChild(el); c++; }); document.getElementById('tScans').textContent=c; });
}
function render(){
  const busca=document.getElementById('busca').value.toLowerCase(); const fStatus=document.getElementById('fStatus').value; const fPetshop=document.getElementById('fPetshop').value;
  let filtered=allData.filter(d=>{ let ok=true; if(busca) ok=(d.petNome||'').toLowerCase().includes(busca)||(d.donoNome||'').toLowerCase().includes(busca)||(d.telefone||'').includes(busca)||(d.endereco||'').toLowerCase().includes(busca); if(fStatus) ok=ok&&d.status===fStatus; if(fPetshop) ok=ok&&(d.petshopId||'publico')===fPetshop; return ok; });
  document.getElementById('tTotal').textContent=allData.length; document.getElementById('tPerdidos').textContent=allData.filter(d=>d.status==='perdido').length; document.getElementById('tSeguros').textContent=allData.filter(d=>d.status==='seguro').length; document.getElementById('tAtivos').textContent=allData.filter(d=>d.ativo!==false).length;
  const tbody=document.getElementById('tbody'); tbody.innerHTML=''; filtered.forEach(d=>{ const tr=document.createElement('tr'); tr.className='border-t border-white/5 hover:bg-white/5'; tr.innerHTML=`<td class="p-3 flex gap-2 items-center"><img src="${d.foto||''}" class="w-10 h-10 rounded-xl object-cover bg-black"><div><p class="font-bold text-sm">${d.petNome}</p><p class="text-[11px] text-gray-400">${d.endereco||''}</p></div></td><td class="p-3"><p class="text-sm">${d.donoNome}</p><p class="text-xs text-green-400">${d.telefone}</p></td><td class="p-3"><div class="flex flex-col gap-1"><span class="px-2 py-1 rounded-full text-[10px] text-center ${d.status==='perdido'?'bg-orange-500 text-black font-black':'bg-green-500/20 text-green-400'}">${d.status}</span><button onclick="toggleAtivo('${d.id}',${d.ativo!==false})" class="px-2 py-1 rounded-full text-[10px] ${d.ativo===false?'bg-red-500/30 text-red-400':'bg-white/10'}">${d.ativo===false?'❌ Desativado':'✅ Ativo'}</button></div></td><td class="p-3"><p class="text-[11px] font-mono">${d.shortId}</p>${d.recompensa? `<p class="text-[10px] text-yellow-400">💰 R$${d.recompensa}</p>`:''}<a href="https://mapapet-ad359.web.app/pet-final.html?sid=${d.shortId}" target="_blank" class="text-[10px] text-cyan-400 underline">QR/NFC</a></td><td class="p-3 flex flex-col gap-1"><div class="flex gap-1"><button onclick="toggleStatus('${d.id}','${d.status}')" class="bg-white/10 px-2 py-1 rounded text-[10px]">${d.status==='perdido'?'✅ Seguro':'🚨 Perdido'}</button><button onclick="del('${d.id}')" class="bg-red-500/20 text-red-400 px-2 py-1 rounded text-[10px]">🗑️</button></div><a href="https://wa.me/55${d.telefone}" target="_blank" class="bg-green-500/20 text-green-400 px-2 py-1 rounded text-[10px] text-center">Whats</a></div></td>`; tbody.appendChild(tr); }); }
document.getElementById('busca').addEventListener('input', render); document.getElementById('fStatus').addEventListener('change', render); document.getElementById('fPetshop').addEventListener('change', render);
window.toggleStatus=async(id, cur)=>{ await updateDoc(doc(db,'clientes',id),{status:cur==='perdido'?'seguro':'perdido'}); }
window.toggleAtivo=async(id, cur)=>{ await updateDoc(doc(db,'clientes',id),{ativo:!cur}); }
window.del=async(id)=>{ if(!confirm('Apagar? LGPD'))return; await deleteDoc(doc(db,'clientes',id)); }
window.exportCSV=()=>{ let csv='Pet,Tutor,Whats,Status,Ativo,ShortId,Bairro,Recompensa\\n'; allData.forEach(d=>{ csv+=`"${d.petNome}","${d.donoNome}","${d.telefone}","${d.status}","${d.ativo!==false}","${d.shortId}","${d.endereco||''}","${d.recompensa||''}"\\n`; }); const blob=new Blob([csv],{type:'text/csv'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='mapapet.csv'; a.click(); }
</script></body></html>
