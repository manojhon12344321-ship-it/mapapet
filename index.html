<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MapaPet - Painel Completo</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
<div class="max-w-6xl mx-auto p-4">
<h1 class="text-4xl font-black text-center py-6">🐾 MapaPet - Painel do Dono</h1>
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
<div class="bg-white rounded-2xl shadow-xl p-6">
<h2 class="text-xl font-bold mb-4">Cadastrar Nova Tag</h2>
<div class="space-y-3">
<input id="donoNome" class="w-full border-2 rounded-lg p-3" placeholder="Nome do Dono *">
<input id="telefone" class="w-full border-2 rounded-lg p-3" placeholder="WhatsApp com DDD * ex: 73988776655">
<div class="grid grid-cols-2 gap-3">
<input id="petNome" class="w-full border-2 rounded-lg p-3" placeholder="Nome do Pet *">
<input id="raca" class="w-full border-2 rounded-lg p-3" placeholder="Raça / Porte">
</div>
<input id="cor" class="w-full border-2 rounded-lg p-3" placeholder="Cor da coleira / Observação">
<input id="foto" type="file" accept="image/*" class="w-full border-2 rounded-lg p-3">
<img id="preview" class="hidden w-full h-48 object-cover rounded-xl mt-2">
<button id="btnSalvar" class="w-full bg-black text-white font-bold py-4 rounded-xl hover:bg-gray-800 transition">GERAR TAG + QR CODE</button>
</div>
<div id="resultado" class="hidden mt-6 border-t-2 pt-4">
<p class="text-center font-bold text-green-600 text-lg">✅ TAG GERADA COM SUCESSO!</p>
<div class="flex justify-center my-4 bg-white p-4 rounded-xl"><div id="qrcode"></div></div>
<p class="text-xs text-gray-500 text-center">Link completo:</p>
<p id="linkTag" class="font-mono bg-gray-100 p-2 rounded text-xs break-all text-center"></p>
<p class="text-xs text-gray-500 text-center mt-3">Link curto para imprimir na tag:</p>
<p id="linkCurto" class="font-mono bg-black text-white p-2 rounded text-xs break-all text-center mt-1"></p>
</div>
</div>
<div class="space-y-6">
<div class="bg-white rounded-2xl shadow-xl p-6">
<h2 class="text-xl font-bold mb-3">📍 Mapa Geral</h2>
<div id="map" class="h-64 rounded-xl border"></div>
</div>
<div class="bg-white rounded-2xl shadow-xl p-6">
<h2 class="text-xl font-bold mb-3">🔔 Notificações - Pets Encontrados</h2>
<div id="listaNotificacoes" class="space-y-2 max-h-64 overflow-auto"><p class="text-gray-400 text-sm">Nenhuma notificação ainda</p></div>
</div>
</div>
</div>
<div class="bg-white rounded-2xl shadow-xl p-6 mt-6">
<h2 class="text-xl font-bold mb-4">📋 Clientes Cadastrados</h2>
<div id="listaClientes" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBBnA9orBCf3j1_3nRHWcIctLe7aKMgcI8",
  authDomain: "mapapet-ad359.firebaseapp.com",
  projectId: "mapapet-ad359",
  storageBucket: "mapapet-ad359.firebasestorage.app",
  messagingSenderId: "268931015194",
  appId: "1:268931015194:web:5ae634751c3be46ebe67a3"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let fotoBase64 = "";
document.getElementById('foto').addEventListener('change', e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    fotoBase64 = ev.target.result;
    const img = document.getElementById('preview');
    img.src = fotoBase64;
    img.classList.remove('hidden');
  };
  reader.readAsDataURL(file);
});
function gerarShortId(){ return Math.random().toString(36).substring(2,7).toUpperCase(); }
const map = L.map('map').setView([-17.5, -39.7], 4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
async function carregarClientes(){
  const q = query(collection(db, "clientes"), orderBy("criadoEm", "desc"));
  const snap = await getDocs(q);
  const lista = document.getElementById('listaClientes');
  lista.innerHTML = "";
  if(snap.empty){ lista.innerHTML = '<p class="text-gray-400">Nenhum cliente ainda. Cadastre o primeiro!</p>'; return; }
  snap.forEach(doc => {
    const d = doc.data();
    const div = document.createElement('div');
    div.className = "border-2 rounded-xl p-3 bg-gray-50";
    div.innerHTML = `<img src="${d.foto || 'https://via.placeholder.com/150?text=Sem+Foto'}" class="w-full h-32 object-cover rounded-lg mb-2"><p class="font-bold text-lg">${d.petNome}</p><p class="text-sm text-gray-600">${d.donoNome}</p><p class="text-xs text-gray-500">${d.telefone}</p><p class="text-xs font-mono bg-white border p-1 rounded mt-2 text-center">/p/${d.shortId}</p><div class="flex gap-2 mt-2"><a href="pet-final.html?sid=${d.shortId}" target="_blank" class="flex-1 text-center text-xs bg-blue-600 text-white py-2 rounded">Ver página</a><a href="https://manojhon12344321-ship-it.github.io/mapapet/p/${d.shortId}" target="_blank" class="flex-1 text-center text-xs bg-black text-white py-2 rounded">Link curto</a></div>`;
    lista.appendChild(div);
  });
}
async function carregarNotificacoes(){
  try{
    const q = query(collection(db, "notificacoes"), orderBy("data", "desc"));
    const snap = await getDocs(q);
    const lista = document.getElementById('listaNotificacoes');
    if(snap.empty) return;
    lista.innerHTML = "";
    snap.forEach(doc => {
      const d = doc.data();
      const dataHora = d.data?.toDate ? d.data.toDate().toLocaleString('pt-BR') : '';
      const div = document.createElement('div');
      div.className = "border rounded-lg p-3 text-sm bg-yellow-50";
      div.innerHTML = `<b>🐾 ${d.petNome || 'Pet'}</b> <span class="text-xs">(${d.shortId})</span><br><span class="text-xs text-gray-600">${d.tipo || ''} - ${dataHora}</span><br>${d.lat ? `<a href="https://www.google.com/maps?q=${d.lat},${d.lng}" target="_blank" class="text-blue-600 underline text-xs">Ver localização no mapa</a>` : ''}`;
      lista.appendChild(div);
    });
  }catch(e){ console.log(e); }
}
document.getElementById('btnSalvar').addEventListener('click', async () => {
  const donoNome = document.getElementById('donoNome').value.trim();
  const telefone = document.getElementById('telefone').value.replace(/\D/g,'').trim();
  const petNome = document.getElementById('petNome').value.trim();
  const raca = document.getElementById('raca').value.trim();
  const cor = document.getElementById('cor').value.trim();
  if(!donoNome || !telefone || !petNome){ alert('Preencha Dono, WhatsApp e Pet'); return; }
  const btn = document.getElementById('btnSalvar');
  btn.textContent = "SALVANDO..."; btn.disabled = true;
  const shortId = gerarShortId();
  try{
    await addDoc(collection(db, "clientes"), { shortId, donoNome, telefone, petNome, raca, cor, foto: fotoBase64, criadoEm: serverTimestamp() });
    const link = `https://mapapet-ad359.web.app/pet-final.html?sid=${shortId}`;
    const linkCurto = `https://manojhon12344321-ship-it.github.io/mapapet/p/${shortId}`;
    const linkCurtoFirebase = `https://mapapet-ad359.web.app/p/${shortId}`;
    document.getElementById('resultado').classList.remove('hidden');
    document.getElementById('linkTag').textContent = link;
    document.getElementById('linkCurto').textContent = linkCurtoFirebase + " (ou) " + linkCurto;
    document.getElementById('qrcode').innerHTML = "";
    new QRCode(document.getElementById('qrcode'), { text: link, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.H });
    carregarClientes();
    btn.textContent = "GERADO! CADASTRAR OUTRO";
    btn.disabled = false;
    window.scrollTo(0, document.body.scrollHeight);
  }catch(e){
    alert('Erro ao salvar: ' + e.message + '\nVerifique as Regras do Firestore');
    btn.textContent = "GERAR TAG + QR CODE";
    btn.disabled = false;
  }
});
carregarClientes();
carregarNotificacoes();
</script>
</body>
</html>
